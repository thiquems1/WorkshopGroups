<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workshop 1: Practice Face-work</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;
  --bg:#f6f5f1;--card:#ffffff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e2e0d8;--accent:#2f5d50;--accent-ink:#ffffff;--soft:#e6efe9;--warn:#b5532c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151614;--card:#1f211e;--ink:#f0efe9;--muted:#a3a29a;--line:#33352f;--accent:#6fb09c;--accent-ink:#10201a;--soft:#243029;--warn:#e08a5f}}
:root[data-theme="dark"]{--bg:#151614;--card:#1f211e;--ink:#f0efe9;--muted:#a3a29a;--line:#33352f;--accent:#6fb09c;--accent-ink:#10201a;--soft:#243029;--warn:#e08a5f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.stagecount{color:var(--muted);font-size:.8rem;margin-bottom:14px}
p.big{font-size:1.08rem;margin:0 0 14px}
ul.tight{margin:0 0 14px;padding-left:1.2em}
ul.tight li{margin-bottom:4px}
.groupgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.gbtn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:22px 10px;font-size:1.3rem;font-weight:800;cursor:pointer}
.gbtn:active{transform:scale(0.98)}
.gbtn small{display:block;font-size:.7rem;font-weight:600;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.03em}
button.primary{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
button.secondary{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:11px 18px;background:transparent;color:var(--ink);cursor:pointer;width:100%;margin-top:8px}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.timer{font-size:3.2rem;font-weight:800;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--warn)}
.timerwrap{text-align:center}
.progress{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:0 0 18px}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.rubric{display:grid;gap:10px;margin:14px 0}
.rubric div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rubric b{display:block;font-size:.85rem;margin-bottom:2px}
.rubric span{color:var(--muted);font-size:.88rem}
.center{text-align:center}
.done h2{margin-top:4px}
</style>
</head>
<body>
<main><div id="app"></div></main>

<script type="application/json" id="data">
{
  "title":"Workshop 1: Practice Face-work",
  "intro":"Groups • 4 Minute Prep • 30 Second Perform • Debrief",
  "scenario":"An employee missed a deadline that affected the team. The manager has to address it in a one-on-one.",
  "groups":{
    "1":{
      "label":"Avoid",
      "brief":"Prevent unnecessary threat before it starts.",
      "prep":["Decide the timing: when and where does this conversation happen?","Decide the discretion: who else knows, or is anyone else present?","Decide the framing: how do you open the conversation?","The missed deadline must still be named clearly — avoiding the threat is not avoiding the issue."],
      "perform":"Perform the opening 30 seconds of the conversation as the manager."
    },
    "2":{
      "label":"Protect (respect & choice)",
      "brief":"Stay direct while preserving dignity, using respect and choice.",
      "prep":["State the impact of the missed deadline plainly.","Give the employee a real choice: invite their view on what happened.","Invite their input on how to fix it going forward.","The standard still holds — this is not about lowering expectations."],
      "perform":"Perform 30 seconds of the conversation as the manager."
    },
    "3":{
      "label":"Protect (recognition)",
      "brief":"Stay direct while showing you value the person.",
      "prep":["State the impact of the missed deadline plainly.","Acknowledge something specific this person contributes to the team.","Do this without softening the standard or the accountability.","Recognition should feel earned, not like a consolation prize."],
      "perform":"Perform 30 seconds of the conversation as the manager."
    },
    "4":{
      "label":"Repair",
      "brief":"Your first comment landed badly — the employee has gone quiet and defensive.",
      "prep":["Acknowledge the misstep in how you said it.","Clarify what you actually meant.","Reset the conversation toward solving the problem together.","The standard still holds — repair is not retreat."],
      "perform":"Perform 30 seconds of the conversation, starting from the repair."
    }
  },
  "rubric":[
    {"label":"Clarity","q":"Is the issue unmistakably clear?"},
    {"label":"Face","q":"What identity need was at risk — theirs, yours, or both?"},
    {"label":"Language","q":"Which words reduced unnecessary threat?"},
    {"label":"Accountability","q":"Does the standard still hold?"}
  ]
}
</script>

<script>
(function(){
  var DATA=JSON.parse(document.getElementById("data").textContent);
  var app=document.getElementById("app");
  var state={group:null,stage:0};
  var STAGE_NAMES=["Group","Scenario","Prep","Perform","Discuss","Review"];

  function el(tag,attrs,text){
    var e=document.createElement(tag);
    if(attrs){for(var k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k]);}}
    if(text!==undefined) e.textContent=text;
    return e;
  }
  function fmt(sec){
    var m=Math.floor(sec/60), s=sec%60;
    return m+":"+(s<10?"0":"")+s;
  }

  function progressBar(){
    var pct = state.group===null ? 0 : Math.round((state.stage/(STAGE_NAMES.length-1))*100);
    var wrap=el("div",{class:"progress"});
    var fill=el("div");fill.style.width=pct+"%";
    wrap.appendChild(fill);
    return wrap;
  }

  function header(stageIdx,label){
    var head=el("div");
    head.appendChild(progressBar());
    if(label) head.appendChild(el("div",{class:"stagecount"},"Stage "+(stageIdx)+" of "+(STAGE_NAMES.length-1)+" · "+label));
    return head;
  }

  function render(){
    app.replaceChildren();
    app.appendChild(el("h1",null,DATA.title));
    if(state.group===null){
      app.appendChild(el("p",{class:"sub"},DATA.intro));
      renderPicker();
      return;
    }
    app.appendChild(el("p",{class:"sub"},"Group "+state.group+" · "+DATA.groups[state.group].label));
    switch(state.stage){
      case 1: renderScenario(); break;
      case 2: renderPrep(); break;
      case 3: renderPerform(); break;
      case 4: renderDiscuss(); break;
      case 5: renderReview(); break;
      default: renderScenario();
    }
  }

  function renderPicker(){
    var card=el("div",{class:"card"});
    card.appendChild(el("div",{class:"tag"},"Step 1"));
    card.appendChild(el("p",{class:"big"},"Which group are you in?"));
    var grid=el("div",{class:"groupgrid"});
    ["1","2","3","4"].forEach(function(g){
      var b=el("button",{class:"gbtn"});
      b.appendChild(document.createTextNode(g));
      b.appendChild(el("small",null,DATA.groups[g].label));
      b.addEventListener("click",function(){state.group=g;state.stage=1;render();window.scrollTo(0,0);});
      grid.appendChild(b);
    });
    card.appendChild(grid);
    app.appendChild(card);
  }

  function navButtons(backFn,nextLabel,nextFn){
    var row=el("div",{class:"row2"});
    if(backFn){
      var b=el("button",{class:"secondary"},"Back");
      b.addEventListener("click",backFn);
      row.appendChild(b);
    }
    if(nextFn){
      var n=el("button",{class:"primary"},nextLabel||"Continue");
      n.addEventListener("click",nextFn);
      row.appendChild(n);
    }
    return row;
  }

  function renderScenario(){
    app.appendChild(header(1,"Scenario"));
    var card=el("div",{class:"card"});
    card.appendChild(el("div",{class:"tag"},"Scenario"));
    card.appendChild(el("p",{class:"big"},DATA.scenario));
    card.appendChild(el("p",{class:"big"},DATA.groups[state.group].brief));
    card.appendChild(el("p",{style:"color:var(--muted)"},"Everyone in your group has this same scenario and move. You'll each prep on your own, then come together as a group to perform and discuss."));
    app.appendChild(card);
    app.appendChild(navButtons(
      function(){state.group=null;state.stage=0;render();window.scrollTo(0,0);},
      "Start prep (4 min)",
      function(){state.stage=2;render();window.scrollTo(0,0);}
    ));
  }

  function renderPrep(){
    app.appendChild(header(2,"Prep"));
    var card=el("div",{class:"card"});
    card.appendChild(el("div",{class:"tag"},"Prep — on your own, 4 minutes"));
    card.appendChild(el("p",{style:"color:var(--muted);margin-top:-6px"},"Work through this by yourself. Your group will compare notes and perform together next."));
    var list=el("ul",{class:"tight"});
    DATA.groups[state.group].prep.forEach(function(line){list.appendChild(el("li",null,line));});
    card.appendChild(list);
    var tw=el("div",{class:"timerwrap"});
    var t=el("div",{class:"timer"},"4:00");
    tw.appendChild(t);
    var startBtn=el("button",{class:"primary"},"Start timer");
    tw.appendChild(startBtn);
    card.appendChild(tw);
    app.appendChild(card);

    var timerHandle=null;
    startBtn.addEventListener("click",function(){
      if(timerHandle)return;
      var remaining=240;
      startBtn.textContent="Timer running…";
      startBtn.disabled=true;
      timerHandle=setInterval(function(){
        remaining--;
        t.textContent=fmt(Math.max(remaining,0));
        if(remaining<=30) t.classList.add("warn");
        if(remaining<=0){
          clearInterval(timerHandle);
          t.textContent="Time's up";
        }
      },1000);
    });

    app.appendChild(navButtons(
      function(){if(timerHandle)clearInterval(timerHandle);state.stage=1;render();window.scrollTo(0,0);},
      "Group's ready to perform",
      function(){if(timerHandle)clearInterval(timerHandle);state.stage=3;render();window.scrollTo(0,0);}
    ));
  }

  function renderPerform(){
    app.appendChild(header(3,"Perform"));
    var card=el("div",{class:"card"});
    card.appendChild(el("div",{class:"tag"},"Perform — as a group, 30 seconds"));
    card.appendChild(el("p",{style:"color:var(--muted);margin-top:-6px"},"Come together with your group. Decide together whose version to perform, or blend the best parts of each person's prep."));
    card.appendChild(el("p",{class:"big"},DATA.groups[state.group].perform));
    var tw=el("div",{class:"timerwrap"});
    var t=el("div",{class:"timer"},"0:30");
    tw.appendChild(t);
    var startBtn=el("button",{class:"primary"},"Start timer");
    tw.appendChild(startBtn);
    card.appendChild(tw);
    app.appendChild(card);

    var timerHandle=null;
    startBtn.addEventListener("click",function(){
      if(timerHandle)return;
      var remaining=30;
      startBtn.textContent="Timer running…";
      startBtn.disabled=true;
      t.classList.add("warn");
      timerHandle=setInterval(function(){
        remaining--;
        t.textContent="0:"+(remaining<10?"0":"")+remaining;
        if(remaining<=0){
          clearInterval(timerHandle);
          t.textContent="Time's up";
        }
      },1000);
    });

    app.appendChild(navButtons(
      function(){if(timerHandle)clearInterval(timerHandle);state.stage=2;render();window.scrollTo(0,0);},
      "Continue to discuss",
      function(){if(timerHandle)clearInterval(timerHandle);state.stage=4;render();window.scrollTo(0,0);}
    ));
  }

  function renderDiscuss(){
    app.appendChild(header(4,"Discuss"));
    var card=el("div",{class:"card"});
    card.appendChild(el("div",{class:"tag"},"Discuss — as a group"));
    card.appendChild(el("p",{style:"color:var(--muted);margin-top:-6px"},"Talk through these as a group, comparing how each person's individual prep played out in the performance."));
    var list=el("ul",{class:"tight"});
    ["What did the manager say, exactly?","How did your individual preps differ, and why?","What identity need were you protecting or addressing — autonomy, competence, or both?","Did the standard (the deadline, the expectation) still come through clearly?","What would you change if you did this again?"].forEach(function(l){list.appendChild(el("li",null,l));});
    card.appendChild(list);
    app.appendChild(card);
    app.appendChild(navButtons(
      function(){state.stage=3;render();window.scrollTo(0,0);},
      "Continue to review",
      function(){state.stage=5;render();window.scrollTo(0,0);}
    ));
  }

  function renderReview(){
    app.appendChild(header(5,"Review"));
    var card=el("div",{class:"card done"});
    card.appendChild(el("div",{class:"tag"},"Review rubric"));
    card.appendChild(el("p",{class:"big"},"Use these four questions during the group share-out."));
    var rub=el("div",{class:"rubric"});
    DATA.rubric.forEach(function(r){
      var d=el("div");
      d.appendChild(el("b",null,r.label));
      d.appendChild(el("span",null,r.q));
      rub.appendChild(d);
    });
    card.appendChild(rub);
    card.appendChild(el("p",{class:"center",style:"color:var(--muted);margin-top:16px"},"Not the nicest response — the clearest response that preserves productive engagement."));
    app.appendChild(card);
    app.appendChild(navButtons(
      function(){state.stage=4;render();window.scrollTo(0,0);},
      "Start over",
      function(){state.group=null;state.stage=0;render();window.scrollTo(0,0);}
    ));
  }

  render();
})();
</script>
</body>
</html>
