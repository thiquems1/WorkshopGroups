<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workshop 1: Practice Face-work</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f5f1;--card:#ffffff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e2e0d8;--accent:#2f5d50;--accent-ink:#ffffff;--soft:#e6efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151614;--card:#1f211e;--ink:#f0efe9;--muted:#a3a29a;--line:#33352f;--accent:#6fb09c;--accent-ink:#10201a;--soft:#243029}}
:root[data-theme="dark"]{--bg:#151614;--card:#1f211e;--ink:#f0efe9;--muted:#a3a29a;--line:#33352f;--accent:#6fb09c;--accent-ink:#10201a;--soft:#243029}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.secondary{background:var(--soft);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:700;color:#fff;font-size:.95rem}
.result h2{font-size:2rem;margin:12px 0 4px}
.prompt{font-size:1.15rem;margin:8px 0 0}
.hint{color:var(--muted);font-size:.85rem;margin-top:8px}
.err{color:#c0392b;font-size:.9rem;margin-top:8px}
details summary{cursor:pointer;font-weight:700}
.groups{display:grid;gap:10px;margin-top:12px}
.g{border:1px solid var(--line);border-radius:12px;padding:12px}
.g b{display:block;margin-bottom:4px}
.g small{color:var(--muted)}
#qr{margin-top:12px;background:#fff;padding:12px;display:inline-block;border-radius:12px}
#qr:empty{display:none}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <div id="app"></div>
</main>

<script type="application/json" id="state">{"title":"Workshop 1: Practice Face-work","prompts":["Scenario: an employee missed a deadline that affected the team, and you are the manager in a one-on-one. Your move is AVOID: prevent unnecessary threat before it starts. Decide the timing (when and where?), the discretion (who knows or is present?), and the framing (how do you open?). You have 4 minutes to prep, then perform the first 30 seconds as the manager. The missed deadline must still be named clearly.","Scenario: an employee missed a deadline that affected the team, and you are the manager in a one-on-one. Your move is PROTECT (respect and choice): stay direct while preserving dignity. State the impact of the miss plainly, then give them a real choice by inviting their view on what happened and how to fix it. You have 4 minutes to prep, then perform 30 seconds as the manager.","Scenario: an employee missed a deadline that affected the team, and you are the manager in a one-on-one. Your move is PROTECT (recognition): stay direct while showing you value the person. State the impact of the miss plainly, and acknowledge something specific they contribute to the team, without softening the standard. You have 4 minutes to prep, then perform 30 seconds as the manager.","Scenario: an employee missed a deadline that affected the team, and you are the manager in a one-on-one. Your move is REPAIR: your first comment landed badly and the employee has gone quiet and defensive. Acknowledge the misstep, clarify what you actually meant, and reset toward solving the problem. You have 4 minutes to prep, then perform 30 seconds as the manager. The standard still holds."],"roster":{}}</script>
<script>
(function(){
  var COLORS=["#2f5d50","#b5532c","#3b5fa8","#8a4f9e","#a1802a","#2d7f8f","#a83a55","#5b7a2b"];
  var stateEl=document.getElementById("state");
  var state=JSON.parse(stateEl.textContent);
  var app=document.getElementById("app");

  function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g," ");}
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function has(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
  function groupFor(name){
    var k=norm(name);
    if(has(state.roster,k)) return state.roster[k];
    return hash(k)%state.prompts.length;
  }
  function el(tag,attrs,text){
    var e=document.createElement(tag);
    if(attrs){for(var a in attrs){e.setAttribute(a,attrs[a]);}}
    if(text!==undefined) e.textContent=text;
    return e;
  }

  function render(){
    app.replaceChildren();
    app.appendChild(el("h1",null,state.title));
    app.appendChild(el("p",{"class":"sub"},"Enter your name to find out your group and your activity."));

    var card=el("div",{"class":"card"});
    card.appendChild(el("label",{"for":"nm"},"Your name"));
    var input=el("input",{type:"text",id:"nm",autocomplete:"name",placeholder:"e.g. Alex Kim"});
    card.appendChild(input);
    var row=el("div",{"class":"row"});
    var go=el("button",null,"Get my group");
    row.appendChild(go);
    card.appendChild(row);
    var err=el("div",{"class":"err hidden"});
    card.appendChild(err);
    app.appendChild(card);

    var out=el("div",{"class":"card result hidden"});
    app.appendChild(out);

    function submit(){
      var name=input.value.trim();
      if(!name){err.textContent="Please enter your name.";err.classList.remove("hidden");return;}
      err.classList.add("hidden");
      var g=groupFor(name);
      out.replaceChildren();
      var b=el("span",{"class":"badge"},"Group "+(g+1));
      b.style.background=COLORS[g%COLORS.length];
      out.appendChild(el("div",null,"Welcome, "+name+"!"));
      out.appendChild(b);
      out.appendChild(el("p",{"class":"prompt"},state.prompts[g]));
      out.classList.remove("hidden");
    }
    go.addEventListener("click",submit);
    input.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});

  }

  render();
})();
</script>
</body>
</html>
